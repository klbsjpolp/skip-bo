version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # typescript-eslint ne supporte pas encore TypeScript 6/7 (peer: <6.1.0)
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # vitest and its @vitest/* add-ons peer-depend on the exact same version
      # (pinned together via the pnpm catalog). Dependabot resolves each one
      # on its own: the add-ons' hard peer on vitest blocks them, vitest's
      # optional peers do not, so it ships a vitest-only bump that fails
      # `pnpm peers check`. Bump the family by hand instead:
      #   pnpm update -r --latest vitest '@vitest/*'
      - dependency-name: 'vitest'
      - dependency-name: '@vitest/*'
    # pnpm rejects lockfile entries younger than its 24h minimumReleaseAge;
    # hold updates a few days so CI can install what Dependabot proposes.
    cooldown:
      default-days: 3
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      vite:
        patterns:
          - 'vite'
          - '@vitejs/*'
          - 'vite-plugin-*'
          - 'esbuild'
          - 'rollup'
      typescript-eslint:
        patterns:
          - 'typescript'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'eslint'
          - '@eslint/*'
          - 'eslint-plugin-*'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'postcss'
          - 'autoprefixer'
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
          - 'aws-sdk'
      sentry:
        patterns:
          - '@sentry/*'
      testing:
        patterns:
          - '@playwright/*'
          - 'playwright'
          - 'jsdom'
          - '@testing-library/*'
      commit-tooling:
        patterns:
          - '@commitlint/*'
          - 'commitlint'
          - 'commitizen'
          - 'cz-*'
          - 'commit-and-tag-version'
          - 'husky'
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns:
          - '*'
